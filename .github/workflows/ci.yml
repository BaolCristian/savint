name: ci

# Runs what a developer is expected to do before committing: type-check,
# lint, the vitest unit/integration suite (~1,780 tests, ~60 files talk to
# Postgres), and the production build.
#
# Out of scope for now: the Playwright end-to-end tests (tests/e2e). They
# need a running server with seeded data, and wiring that up correctly
# deserves its own pass rather than being bolted onto this first workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: savint
          POSTGRES_PASSWORD: savint
          POSTGRES_DB: savint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U savint -d savint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Throwaway service-container credentials — this database exists only
      # for the lifetime of this job and is never reachable from anywhere else.
      DATABASE_URL: postgresql://savint:savint@localhost:5432/savint
      # Fake values for what the app genuinely reads at build/test time
      # (verified by reproducing this workflow's steps in a scratch clone —
      # see the PR/commit description). Nothing here is a real secret.
      NEXTAUTH_SECRET: ci-fake-secret-not-used-anywhere-real
      AUTH_TRUST_HOST: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Type-check
        run: npx tsc --noEmit

      # Il lint gira DUE volte, di proposito.
      #
      # Sulla superficie che manteniamo attivamente blocca: oggi è pulita, e
      # un lint che non blocca su codice pulito non impedisce niente — la
      # prima violazione nuova entrerebbe senza che nessuno la veda.
      - name: Lint (superficie mantenuta — blocca)
        run: >
          npx eslint --quiet
          src/lib/esercizi
          src/app/api/esercizi
          src/components/esercizi
          "src/app/(dashboard)/dashboard/esercizi"
          "src/app/(student)"
          packages/engine

      # Sul resto del repository non blocca. L'arretrato misurato al
      # 2026-09-08 è di 123 errori su 79 file, ereditati e non toccati dal
      # lavoro recente: 102 sono `no-explicit-any`, e 17 sono errori del
      # compilatore React (Math.random durante il render nelle viste del
      # quiz dal vivo, setState sincrono dentro un effetto). Questi ultimi
      # sono difetti veri e vanno affrontati, ma riscrivere 79 file legacy
      # per far passare la CI e' molto rumore e rischio in codice che oggi
      # funziona. Il passo resta visibile nel log: non e' cancellato, non e'
      # silenziato, semplicemente non blocca finche' l'arretrato c'e'.
      - name: Lint (tutto il repository — non blocca)
        run: npm run lint
        continue-on-error: true

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
